<!DOCTYPE html>
<html data-bs-theme="light">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, shrink-to-fit=no">
    <title>egiedeasis.com</title>
    <link rel="stylesheet" href="assets/bootstrap/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Lato:300,400,700&amp;display=swap">
    <link rel="stylesheet" href="assets/css/pikaday.min.css">
</head>

<body><style>
    body {
        margin: 0;
        background: #111;
        color: white;
        font-family: Arial, sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
    }

    .container {
        text-align: center;
        width: 90%;
        max-width: 700px;
    }

    h1 {
        font-size: 2rem;
        margin-bottom: 2px;
    }

    .drill {
        font-size: 2rem;
        margin: 10px 0;
        color: #00ffb3;
        min-height: 80px;
    }

    .timer {
        font-size: 4rem;
        margin: 15px 0;
    }

    .total-timer {
        font-size: 2rem;
        color: #00ffb3;
    }
    
    .controls {
        margin-top: 30px;
    }

    button {
        padding: 12px 24px;
        margin: 10px;
        border: none;
        border-radius: 10px;
        font-size: 1rem;
        cursor: pointer;
    }

    .start { background: #00c853; color: white; }
    .pause { background: #ff9100; color: white; }
    .reset { background: #d50000; color: white; }

    .settings {
        margin-top: 20px;
    }

    input {
        padding: 8px;
        width: 80px;
        text-align: center;
        font-size: 1rem;
    }

    label {
        margin: 0 10px;
    }
</style>

<body>

<div class="container">

    <h1>BJJ Drill Randomizer</h1>
<div class="settings">
    <label>
        Category:
        <select id="categorySelect">

            <option value="mix">Mix</option>

            <option value="standing">
                Standing / Grip Fighting
            </option>

            <option value="takedowns">
                Takedowns
            </option>

            <option value="guardPassing">
                Guard Passing
            </option>

            <option value="retention">
                Guard Retention
            </option>

            <option value="positional">
                Positional Escapes
            </option>

        </select>
    </label>
</div>
    <div class="drill" id="drillName">
        Press Start
    </div>
    <div
        id="systemMessage"
        style="
            margin-top:5px;
            color:#ffcc00;
            min-height:10px;
            font-size:0.95rem;
        ">
    </div>

<div
    id="drillDescription"
    style="
        margin-top:20px;
        color:#bbb;
        font-size:1.1rem;
        min-height:60px;">
</div>
    <div class="timer" id="drillTimer">
        00:00
    </div>

    <div class="total-timer">
        Total Remaining: <span id="totalTimer">00:00</span>
    </div>

    <div class="settings">
        <label>
            Total Minutes:
            <input type="number" id="totalMinutes" value="10" min="1">
        </label>

        <label>
            Min Drill Sec:
            <input type="number" id="minDrill" value="45" min="15">
        </label>

        <label>
            Max Drill Sec:
            <input type="number" id="maxDrill" value="90" min="20">
        </label>
    </div>

    <div class="controls">
        <button class="start" onclick="startWorkout()">Start</button>
        <button class="pause" onclick="pauseWorkout()">Pause</button>
        <button class="reset" onclick="resetWorkout()">Reset</button>
        <button onclick="toggleSound()" id="soundButton">
            Sound: ON
        </button>
    </div>

</div>

<script>
const beep = new Audio("beep.mp3");
const bell = new Audio("bell.mp3");
//const transition = new Audio("transition.mp3");
let plannedWorkout = [];
let currentWorkoutIndex = 0;
let inBuffer = false;
const BUFFER_SECONDS = 10;

const drills = {
    takedowns: [
        {
            name: "Shot Entry Reps",
            description: "Practice level changes and penetration steps for explosive takedown entries."
        },
        {
            name: "Single-Leg Lift and Return",
            description: "Work balance, lifting mechanics, and controlled finishes."
        },
        {
            name: "Snap Down to Front Headlock",
            description: "Develop timing for snapping opponents into front headlock control."
        },
        {
            name: "Foot Sweep Timing Drill",
            description: "Train off-balancing and sweep timing using light movement."
        }
    ],

    guardPassing: [
        {
            name: "Toreando Pass Drill",
            description: "Practice fast side-to-side passing movement around the legs."
        },
        {
            name: "Leg Drag Flow",
            description: "Chain leg drag entries while maintaining upper body control."
        },
        {
            name: "Knee Cut Movement Drill",
            description: "Focus on angle creation and knee slice pressure."
        },
        {
            name: "Bullfighter Pass Reaction Drill",
            description: "Improve passing reactions against moving legs."
        }
    ],

    retention: [
        {
            name: "Hip Escape Mirror Drill",
            description: "Build hip mobility and defensive guard recovery movement."
        },
        {
            name: "Spider Guard Foot Placement Drill",
            description: "Develop active hooks and distance management."
        }
    ],

    positional: [
        {
            name: "Mount Escape Flow",
            description: "Practice bridge and elbow escape combinations."
        },
        {
            name: "Side Control Escape Reps",
            description: "Focus on frames, hip escapes, and guard recovery."
        },
        {
            name: "Back Control Maintenance",
            description: "Maintain hooks and chest connection during movement."
        },
        {
            name: "Turtle Breakdown Drill",
            description: "Work transitions and pressure against turtle defense."
        }
    ],

    standing: [
        {
            name: "Pummeling",
            description: "Develop inside control and underhook awareness."
        },
        {
            name: "Arm Drag Drill",
            description: "Train angle creation and back exposure from standing."
        },
        {
            name: "Grip Fighting",
            description: "Improve hand fighting and dominant grip acquisition."
        }
    ]
};

let totalSeconds = 0;
let currentDrillSeconds = 0;

let totalInterval;
let drillInterval;

let running = false;
let currentDrill = null;
    
beep.preload = "auto";
bell.preload = "auto";
//transition.preload = "auto";

let soundEnabled = true;

function playSound(sound) {

    if (!soundEnabled) return;

    sound.currentTime = 0;

    sound.play().catch(() => {
        /* Prevent mobile autoplay errors */
    });
}

function toggleSound() {

    soundEnabled = !soundEnabled;

    document.getElementById("soundButton").innerText =
        soundEnabled
            ? "Sound: ON"
            : "Sound: OFF";
}
    
function formatTime(sec) {
    const mins = Math.floor(sec / 60).toString().padStart(2, "0");
    const secs = (sec % 60).toString().padStart(2, "0");
    return `${mins}:${secs}`;
}

function getSelectedDrills() {

    const category =
        document.getElementById("categorySelect").value;

    if (category === "mix") {
        return Object.values(drills).flat();
    }

    return drills[category];
}

function randomDuration(min, max) {
    return Math.floor(Math.random() * (max - min + 1)) + min;
}
    
function generateWorkoutPlan(total, min, max) {

    let durations = [];

    /*
    Validation
    */
    if (min > max) {

        return {
            durations: [],
            adjustedTotal: min,
            message:
                "Min Drill Sec cannot exceed Max Drill Sec."
        };
    }

    /*
    If total is smaller than minimum,
    auto-adjust upward.
    */
    if (total < min) {

        return {
            durations: [min],
            adjustedTotal: min,
            message:
                `Total workout time adjusted to ${min} sec because the requested time was too short for the drill constraints.`
        };
    }

    let remaining = total;

    /*
    Safety counter prevents infinite loops.
    */
    let attempts = 0;

    while (remaining > 0 && attempts < 10000) {

        attempts++;

        /*
        Final drill fits perfectly.
        */
        if (
            remaining >= min &&
            remaining <= max
        ) {

            durations.push(remaining);
            remaining = 0;
            break;
        }

        let next =
            randomDuration(min, max);

        let leftover =
            remaining - next;

        /*
        Valid leftover.
        */
        if (
            leftover === 0 ||
            leftover >= min
        ) {

            durations.push(next);
            remaining -= next;
        }
    }

    /*
    If impossible exact allocation,
    adjust total downward.
    */
    let allocated =
        durations.reduce((a, b) => a + b, 0);

    /*
    If allocation completely failed,
    force single valid drill.
    */
    if (allocated === 0) {

        allocated = min;

        durations = [min];
    }

    let message = "";

    if (allocated !== total) {

        message =
            `Adjusted total workout time to ${
                Math.floor(allocated / 60)
            } min ${
                allocated % 60
            } sec to fit drill constraints.`;
    }

    return {
        durations,
        adjustedTotal: allocated,
        message
    };
}

function randomDrill() {

    const selected = getSelectedDrills();

    let next;

    do {
        next = selected[
            Math.floor(Math.random() * selected.length)
        ];
    } while (
        currentDrill &&
        selected.length > 1 &&
        next.name === currentDrill.name
    );

    currentDrill = next;

    return next;
}

function showDrill(drill) {

    document.getElementById("drillName").innerText =
        drill.name;

    document.getElementById("drillDescription").innerText =
        drill.description;
}

function startBuffer(nextCallback) {

    inBuffer = true;

    let buffer = BUFFER_SECONDS;

    //playSound(transition);

    document.getElementById("drillName").innerText =
        "Next Drill Starting...";

    document.getElementById("drillDescription").innerText =
        "Transition / Water Break";

    document.getElementById("drillTimer").innerText =
        formatTime(buffer);

    clearInterval(drillInterval);
    drillInterval = null;

    drillInterval = setInterval(() => {

        if (!running) return;

        buffer--;

        document.getElementById("drillTimer").innerText =
            formatTime(buffer);

        /*
        Last 5 second warning
        */
       if (buffer === 5) {

            beep.pause();
            beep.currentTime = 0;

            playSound(beep);
        }

        if (buffer <= 0) {

            clearInterval(drillInterval);
            drillInterval = null;

            inBuffer = false;

            nextCallback();
        }

    }, 1000);
}

function nextDrill() {

    /*
    Workout complete
    */
    if (
        currentWorkoutIndex >= plannedWorkout.length
    ) {

        clearInterval(drillInterval);
        drillInterval = null;

        document.getElementById("drillName").innerText =
            "Workout Complete";

        document.getElementById("drillDescription").innerText =
            "Great work.";

        document.getElementById("drillTimer").innerText =
            "00:00";

        document.getElementById("totalTimer").innerText =
            "00:00";

        playSound(bell);

        running = false;

        return;
    }

    const drill = randomDrill();

    currentDrillSeconds =
        plannedWorkout[currentWorkoutIndex];

    currentWorkoutIndex++;

    showDrill(drill);

    document.getElementById("drillTimer").innerText =
        formatTime(currentDrillSeconds);

    clearInterval(drillInterval);
    drillInterval = null;

    drillInterval = setInterval(() => {

        if (!running) return;

        if (currentDrillSeconds <= 0) {

            clearInterval(drillInterval);
            drillInterval = null;

            playSound(bell);

            if (
                currentWorkoutIndex >=
                plannedWorkout.length
            ) {

                document.getElementById("drillName").innerText =
                    "Workout Complete";

                document.getElementById("drillDescription").innerText =
                    "Great work.";

                document.getElementById("drillTimer").innerText =
                    "00:00";

                document.getElementById("totalTimer").innerText =
                    "00:00";

                totalSeconds = 0;

                running = false;

                return;
            }

            startBuffer(nextDrill);

            return;
        }

        currentDrillSeconds--;

        if (currentDrillSeconds === 5) {

            beep.pause();
            beep.currentTime = 0;

            playSound(beep);
        }

        totalSeconds--;

        if (totalSeconds < 0) {
            totalSeconds = 0;
        }

        document.getElementById("drillTimer").innerText =
            formatTime(currentDrillSeconds);

        document.getElementById("totalTimer").innerText =
            formatTime(totalSeconds);

    }, 1000);
}
    
function startWorkout() {

    // Resume if paused
    if (!running && totalSeconds > 0 && plannedWorkout.length > 0) {
        running = true;

        if (!drillInterval) {
            nextDrill();
        }

        return;
    }

    // Prevent duplicate starts
    if (running) return;

    running = true;
    
    const requestedMinutes =
        parseInt(
            document.getElementById("totalMinutes").value
        );

    const min =
        parseInt(
            document.getElementById("minDrill").value
        );

    const max =
        parseInt(
            document.getElementById("maxDrill").value
        );

    let requestedSeconds =
        requestedMinutes * 60;

    /*
    Generate valid workout plan.
    */
    const workoutPlan =
        generateWorkoutPlan(
            requestedSeconds,
            min,
            max
        );

    plannedWorkout =
        workoutPlan.durations;

    let allocated =
        workoutPlan.adjustedTotal;

    /*
    If impossible allocation,
    adjust total time.
    */
    document.getElementById(
        "systemMessage"
    ).innerText =
        workoutPlan.message;    

        totalSeconds = allocated;

        currentWorkoutIndex = 0;

        document.getElementById("totalTimer").innerText =
            formatTime(totalSeconds);

        nextDrill();
    }

function pauseWorkout() {
    running = !running;

    document.querySelector(".pause").innerText =
        running ? "Pause" : "Resume";
}

function resetWorkout() {
    document.getElementById("systemMessage").innerText = "";
    running = false;

    clearInterval(totalInterval);
    totalInterval = null;
    clearInterval(drillInterval);
    drillInterval = null;

    totalSeconds = 0;
    currentDrillSeconds = 0;
    currentDrill = null;

    document.getElementById("drillName").innerText =
        "Press Start";

    document.getElementById("drillDescription").innerText =
        "";

    document.getElementById("drillTimer").innerText =
        "00:00";

    document.getElementById("totalTimer").innerText =
        "00:00";
}

</script>
    <script src="assets/bootstrap/js/bootstrap.min.js"></script>
    <script src="assets/js/pikaday.min.js"></script>
    <script src="assets/js/theme.js"></script>
</body>

</html>
